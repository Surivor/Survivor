services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: survivor-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped
