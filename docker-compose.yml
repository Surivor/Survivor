services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: survivor
      MYSQL_USER: survivor
      MYSQL_PASSWORD: survivor
      MYSQL_ROOT_PASSWORD: root
    networks:
      - survivor
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s


  backend:
    image: survivor-backend:latest

    build:
      context: ./backend
      dockerfile: Dockerfile

    depends_on:
      db:
        condition: service_healthy

    env_file:
      - .env

    networks:
      - survivor

    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://backend:3000

      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: survivor
      DB_USER: survivor
      DB_PASSWORD: survivor

    restart: unless-stopped


  frontend:
    image: survivor-frontend:latest

    build:
      context: ./front
      dockerfile: Dockerfile

    depends_on:
      - backend

    networks:
      - survivor

    environment:
      API_URL: http://backend:3000
      NODE_ENV: production
      PORT: 3001

    restart: unless-stopped


  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: survivor-cloudflared

    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://proxy:80

    depends_on:
      - proxy

    networks:
      - survivor

    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: survivor-proxy

    depends_on:
      - frontend
      - backend

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    networks:
      - survivor

    restart: unless-stopped


volumes:
  mysql_data:


networks:
  survivor: