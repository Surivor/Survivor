services:
  db:
    image: mysql:8.0
    container_name: survivor-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: survivor
      MYSQL_USER: survivor
      MYSQL_PASSWORD: survivor
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    networks:
      - survivor
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: survivor-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - survivor
    environment:
      NODE_ENV: development
      PORT: 3000
      WATCHPACK_POLLING: "true"
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: survivor
      DB_USER: survivor
      DB_PASSWORD: survivor
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev
    restart: unless-stopped

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: survivor-frontend
    ports:
      - "3001:3001"
    networks:
      - survivor
    environment:
      NODE_ENV: development
      PORT: 3001
      WATCHPACK_POLLING: "true"
    volumes:
      - ./front:/app
      - /app/node_modules
    command: npm run dev
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  survivor: