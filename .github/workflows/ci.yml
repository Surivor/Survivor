name: MirrorEpitech

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: checkout git
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: push to the mirror
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ secrets.EPITECH_REPO_URL }}
          ssh_private_key: ${{ secrets.EPITECH_SSH_PRIVATE_KEY }}